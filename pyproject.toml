[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandbed"
version = "0.1.0"
description = "Turnkey harness to deploy Canonical OpenStack (Sunbeam) on LXD VMs"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-libmaas>=0.1.3",
    "rich>=15.0.0",
    "tenacity>=8.0",
]

[project.scripts]
sandbed = "sandbed.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["sandbed"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
